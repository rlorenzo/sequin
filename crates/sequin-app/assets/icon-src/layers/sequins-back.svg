<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Back layer master: the three trailing sequins. Hand-drawn, like the flat
       masters beside it; make_icon.sh only rasterises it, to
       Sequin.icon/Assets/sequins-back.png. Geometry and fills are the same
       numbers as icon-detail.svg — that pairing is prose, so keep them in step
       by hand. See DESIGN.md "6. App Icon".

       Separations are real transparency, never paint in the ground colour: a
       layered icon composites over whatever ground the system picks per
       appearance, so a gap "drawn" in #050505 would show as a black scar in the
       tinted and clear renditions. Each disc is bitten by its successor through
       a mask rather than a fill-rule, because the knockout overhangs the disc
       it cuts and even-odd would fill the overhang.

       Fills are sRGB hex because librsvg silently drops `oklch()`; the DESIGN.md
       token each was converted from is in the comment above it. -->
  <defs>
    <mask id="bite" maskUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1024">
      <rect width="1024" height="1024" fill="white"/>
      <circle cx="448.5" cy="512" r="141" fill="black"/>
    </mask>
    <!-- The row is a constant 127px pitch, so one bitten disc drawn three times
         is the whole layer. A single shared mask would not work: each cut is
         concentric with the NEXT disc and wider than it, so one mask holding all
         three knockouts would erase the middle sequins outright. -->
    <circle id="sequin" cx="321.5" cy="512" r="132" mask="url(#bite)"/>
  </defs>
  <!-- oklch(0.545 0.105 75.1) -->
  <use href="#sequin" fill="#93661A"/>
  <!-- oklch(0.636 0.124 75.1) -->
  <use href="#sequin" fill="#B67F1F" transform="translate(127,0)"/>
  <!-- oklch(0.726 0.142 75.1) -->
  <use href="#sequin" fill="#DA9827" transform="translate(254,0)"/>
</svg>
