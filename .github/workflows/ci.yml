name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt · clippy · tests (macOS)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable branch, 2026-07-16
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: rustfmt
        run: cargo fmt --all --check
      - name: clippy (workspace, deny warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings
      - uses: taiki-e/install-action@742a3317eac7bd62f91cd888b4eead5e784ba833 # v2.87.1
        with:
          tool: nextest
      - name: tests
        run: cargo nextest run --workspace
      - name: golden_check.py doctests
        run: python3 -m doctest scripts/golden_check.py

  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The release path is shell, so it gets the same static gate the Rust
      # gets: a typo in sign_notarize.sh would otherwise only surface mid-tag.
      # shellcheck is preinstalled on the ubuntu runner image.
      - name: shellcheck
        run: shellcheck packaging/macos/*.sh .githooks/pre-commit

  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The release workflow is mostly embedded shell -- a preflight guard, a
      # secret check, a signing block -- and the shellcheck job above only
      # sees standalone .sh files. actionlint parses the workflow AND runs
      # shellcheck over every `run:` body, so a quoting slip fails here
      # instead of mid-tag with the Developer ID key already unlocked.
      #
      # Pinned release + checksum for the same reason create-dmg is
      # (release.yml): this runs in the release path's blast radius.
      # Recompute when bumping -- upstream publishes checksums:
      #   curl -fsSL ".../v${VERSION}/actionlint_${VERSION}_checksums.txt"
      - name: Install actionlint
        run: |
          set -euo pipefail
          VERSION="1.7.12"
          SHA256="8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
          curl -fsSL -o "$RUNNER_TEMP/actionlint.tar.gz" \
            "https://github.com/rhysd/actionlint/releases/download/v${VERSION}/actionlint_${VERSION}_linux_amd64.tar.gz"
          echo "${SHA256}  $RUNNER_TEMP/actionlint.tar.gz" | shasum -a 256 -c -
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      # shellcheck is preinstalled on the ubuntu image; actionlint picks it
      # up from PATH and uses it for the `run:` bodies.
      - name: actionlint
        run: actionlint -no-color -oneline

  typos:
    name: typos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: crate-ci/typos@4d9c206a77c041268485162b8e2579ad7a5cb9a3 # v1.50.0

  deny:
    name: cargo-deny (advisories · licenses · bans)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
