name: Release

# Tagging is the trigger; workflow_dispatch exists so the build can be
# exercised without burning a version number.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# The build job only reads the repo. The release job below escalates to
# contents: write for itself, so a compromised build step cannot publish.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build · sign · notarize (macOS)
    # macos-14 is Apple Silicon, so this produces the aarch64 build shipped
    # in July. Intel/universal is an open decision (PLAN.md M5).
    runs-on: macos-14
    # Gates the signing secrets behind required reviewers -- anyone able to
    # push a v* tag can otherwise aim the Developer ID key at whatever that
    # revision contains. This only holds if the six secrets are stored ON the
    # environment: repository-scoped secrets are readable by every job, which
    # would make this line decorative. Referencing an environment that does
    # not exist yet CREATES it, unprotected, so configure it before the first
    # real tag (RELEASE.md has the settings).
    environment: release
    outputs:
      signed: ${{ steps.signing.outputs.enabled }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history so the trusted-ref check below can ask whether the
          # tagged commit is actually reachable from the default branch.
          fetch-depth: 0

      # A tag can be pushed at any commit, including one that never passed
      # CI on main. Refuse to sign code the default branch has not accepted.
      - name: Verify the tag is reachable from main
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_SHA is not an ancestor of origin/main — refusing to sign an unreviewed revision."
            exit 1
          fi
          echo "$GITHUB_SHA is on main."

      # A release tag and the version baked into the app come from different
      # places; if they disagree, the draft release for v0.2.0 would carry a
      # Sequin_0.1.0 DMG. Catch it before spending a signing run.
      - name: Verify the tag matches the workspace version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          CARGO_VERSION="$(sed -n '/^\[workspace\.package\]/,/^\[/p' Cargo.toml \
                           | sed -n 's/^version = "\(.*\)"/\1/p' | head -1)"
          if [ -z "$CARGO_VERSION" ]; then
            echo "::error::no version found under [workspace.package] in Cargo.toml."
            exit 1
          fi
          if [ "$TAG_VERSION" != "$CARGO_VERSION" ]; then
            echo "::error::tag $GITHUB_REF_NAME declares $TAG_VERSION but Cargo.toml says $CARGO_VERSION."
            exit 1
          fi
          echo "tag and workspace version agree: $CARGO_VERSION"

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable branch, 2026-07-16
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - uses: taiki-e/install-action@742a3317eac7bd62f91cd888b4eead5e784ba833 # v2.87.1
        with:
          tool: cargo-binstall
      - name: Install dioxus-cli
        # Pinned to the version used locally: CLAUDE.md pins the Dioxus minor
        # version because 0.x API churn is real, and the bundler is part of
        # that surface.
        run: cargo binstall --no-confirm --force dioxus-cli@0.7.9

      # Secrets cannot be referenced in `if:`, so turn "can we sign?" into an
      # output. All six are required, and the three states are kept distinct
      # on purpose:
      #   all set     -> sign and notarize
      #   none set    -> unsigned artifact (a fork, or a first dispatch)
      #   some set    -> fail loudly, naming what is missing
      # Half-configured is the state a repo passes through while the secrets
      # are being added one at a time. Falling back to unsigned there would
      # quietly hand back an artifact that looks like a release and is not;
      # failing without the name of the missing secret would send you
      # spelunking through a signing log. So: name them.
      - name: Detect signing secrets
        id: signing
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.NOTARY_ISSUER }}
        run: |
          set -euo pipefail
          # Keep in sync with the env: block above -- a secret listed there
          # but not here is silently never checked.
          required="MACOS_CERT_P12 MACOS_CERT_PASSWORD MACOS_SIGN_IDENTITY \
                    NOTARY_KEY_P8 NOTARY_KEY_ID NOTARY_ISSUER"
          present=""
          missing=""
          for name in $required; do
            if [ -n "${!name:-}" ]; then
              present="$present $name"
            else
              missing="$missing $name"
            fi
          done

          if [ -z "$missing" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          elif [ -z "$present" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No signing secrets set — building an UNSIGNED, un-notarized artifact."
          else
            echo "::error::Signing is half-configured. Missing:$missing"
            echo "::error::Set all six (see RELEASE.md) or none. Refusing to guess."
            exit 1
          fi

      # Pinned release + checksum rather than `brew install`: create-dmg runs
      # while the Developer ID key is unlocked, so a hijacked formula would
      # have a code-signing oracle. GitHub publishes no checksum for the
      # tarball; recompute when bumping:
      #   curl -fsSL ".../v${VERSION}.tar.gz" | shasum -a 256
      - name: Install create-dmg
        if: steps.signing.outputs.enabled == 'true'
        run: |
          set -euo pipefail
          VERSION="1.3.0"
          SHA256="c50d2bc97c3d6292642bac55f530d247eaf4bf65ee605f26b4caf339383e381c"
          curl -fsSL -o "$RUNNER_TEMP/create-dmg.tar.gz" \
            "https://github.com/create-dmg/create-dmg/archive/refs/tags/v${VERSION}.tar.gz"
          echo "${SHA256}  $RUNNER_TEMP/create-dmg.tar.gz" | shasum -a 256 -c -
          tar -xzf "$RUNNER_TEMP/create-dmg.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/create-dmg-${VERSION}" >> "$GITHUB_PATH"

      # Imports the Developer ID identity into a throwaway keychain that dies
      # with the runner, then hands off to the same script a local release
      # runs, so CI cannot drift from the hand-validated path.
      - name: Sign & notarize
        if: steps.signing.outputs.enabled == 'true'
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.NOTARY_ISSUER }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PW="$(uuidgen)"
          CERT_P12="$RUNNER_TEMP/cert.p12"
          NOTARY_P8="$RUNNER_TEMP/AuthKey.p8"

          # Wipe key material on ANY exit, including a signing failure --
          # `set -e` would otherwise abort before a trailing rm could run.
          trap 'rm -f "$CERT_P12" "$NOTARY_P8"' EXIT

          security create-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          (umask 077; printf '%s' "$MACOS_CERT_P12" | base64 --decode > "$CERT_P12")
          security import "$CERT_P12" -P "$MACOS_CERT_PASSWORD" \
            -f pkcs12 -k "$KEYCHAIN" \
            -T /usr/bin/codesign -T /usr/bin/security
          # Lets codesign use the key non-interactively -- the same
          # partition-list step a dev Mac needs, applied to the ephemeral one.
          security set-key-partition-list -S apple-tool:,apple: \
            -s -k "$KEYCHAIN_PW" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" "login.keychain-db"

          (umask 077; printf '%s' "$NOTARY_KEY_P8" > "$NOTARY_P8")

          SIGN_IDENTITY="$MACOS_SIGN_IDENTITY" \
          NOTARY_KEY="$NOTARY_P8" \
          NOTARY_KEY_ID="$NOTARY_KEY_ID" \
          NOTARY_ISSUER="$NOTARY_ISSUER" \
            ./packaging/macos/sign_notarize.sh

      # Fallback so a fork or an unconfigured dispatch still yields something
      # runnable. Gatekeeper blocks this on other machines; it is for testing
      # the build, not for distribution, so it is named for what it is rather
      # than versioned. The release job below refuses to attach it.
      - name: Build unsigned (no signing secrets)
        if: steps.signing.outputs.enabled != 'true'
        run: |
          set -euo pipefail
          dx bundle --package sequin-app --package-types macos
          hdiutil create -volname Sequin -ov -format UDZO \
            -srcfolder target/dx/sequin-app/bundle/macos/macos/Sequin.app \
            target/dx/Sequin-UNSIGNED.dmg

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sequin-macos
          path: target/dx/Sequin*.dmg
          if-no-files-found: error

  release:
    name: draft release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') && needs.build.outputs.signed == 'true'
    permissions:
      contents: write # create the draft release
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts/
      # Draft, not published: a notarization that succeeded but produced a
      # broken app should not reach users before a human has looked at it.
      - uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: artifacts/**/*.dmg
          draft: true
          generate_release_notes: true
